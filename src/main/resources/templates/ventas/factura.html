<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Factura de Venta</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; color: #333; }
        .invoice-box { max-width: 800px; margin: auto; padding: 30px; border: 1px solid #eee; box-shadow: 0 0 10px rgba(0, 0, 0, 0.15); }
        .header { display: flex; justify-content: space-between; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        .table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .table th, .table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .table th { background-color: #f2f2f2; }
        .total { text-align: right; font-size: 18px; font-weight: bold; margin-top: 20px; }
        @media print { .btn-print { display: none; } }
    </style>
</head>
<body>
<div class="invoice-box">
    <button class="btn-print" onclick="window.print()" style="float: right; padding: 8px 12px; cursor: pointer;">🖨️ Imprimir</button>

    <div class="header">
        <div>
            <h2>FACTURA</h2>
            <p><strong>N° Venta:</strong> <span th:text="${venta.id}">#1</span></p>
            <p><strong>Fecha:</strong> <span th:text="${#temporals.format(venta.fecha, 'dd/MM/yyyy HH:mm')}">01/01/2026</span></p>
        </div>
    </div>

    <h3>Detalle de la Venta</h3>
    <table class="table">
        <thead>
        <tr>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Precio Unitario</th>
            <th>Subtotal</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d : ${venta.detalles}">
            <td th:text="${d.producto != null ? d.producto.nombre : 'Producto'}">Producto</td>
            <td th:text="${d.cantidad}">1</td>
            <td th:text="${'$ ' + #numbers.formatDecimal(d.precioUnitario, 1, 'POINT', 0, 'POINT')}">$ 0</td>
            <td th:text="${'$ ' + #numbers.formatDecimal(d.cantidad * d.precioUnitario, 1, 'POINT', 0, 'POINT')}">$ 0</td>
        </tr>
        </tbody>
    </table>

    <div class="total">
        <p>Total: <span th:text="${'$ ' + #numbers.formatDecimal(venta.total, 1, 'POINT', 0, 'POINT')}">$ 0</span></p>
    </div>
</div>
</body>
</html>
